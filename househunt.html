<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHK House Hunt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">


    <style>
        /* Custom CSS for hero background animation */
        @keyframes pulseBg {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }
        .animate-pulse-bg {
            animation: pulseBg 20s infinite alternate linear;
        }

        /* Basic global styles for Inter font */
        body {
            font-family: "Inter", sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Modal specific styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .filter-sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1050;
            transition: opacity 0.3s ease-in-out;
        }

        .filter-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 320px;
            background: white;
            box-shadow: 0 0 25px rgba(0,0,0,0.2);
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
            z-index: 1100;
            display: flex;
            flex-direction: column;
        }
        
        .filter-sidebar.open {
            transform: translateX(0);
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 0.75rem; /* rounded-xl */
            max-width: 90%;
            max-height: 90%;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); /* shadow-xl */
            transform: scale(0.95);
            animation: modalPopIn 0.3s forwards cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @keyframes modalPopIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-close-button {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #4a5568; /* gray-700 */
        }
        .modal-close-button:hover {
            color: #e53e3e; /* red-600 */
        }

        /* Splash screen specific styles */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom right, #4f46e5, #818cf8); /* Indigo gradient */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000; /* Higher than modals */
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            transition: opacity 1s;
            opacity: 1;
        }
        
        .splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .splash-screen-logo {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
    </style>
</head>
<body class="bg-gray-100" oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Helper function to create Lucide icons
        const createIcon = (svgPath) => ({ size, ...props }) => (
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width={size || 24}
                height={size || 24}
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                strokeWidth="2"
                strokeLinecap="round"
                strokeLinejoin="round"
                {...props}
            >
                <path d={svgPath} />
            </svg>
        );

        const Menu = createIcon("M4 12h16M4 6h16M4 18h16");
        const UserIcon = createIcon("M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2 M12 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z");
        const LogOut = createIcon("M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M17 17l5-5-5-5M22 12H9");
        const Home = createIcon("M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z");
        const Calendar = createIcon("M8 7V3M16 7V3M6 21h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2Z M4 11h16");
        const MapPin = createIcon("M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z M12 11.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z");
        const X = createIcon("M18 6 6 18M6 6l12 12");
        const FilterIcon = createIcon("M22 3H2l8 9.46V19l4 2v-8.54L22 3z");
        const Eye = createIcon("M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z");
        const EyeOff = createIcon("M9.9 4.24A9.94 9.94 0 0 1 12 2c7 0 10 7 10 7a13.13 13.13 0 0 1-1.67 2.68M6.61 6.61A3 3 0 0 0 12 15a3 3 0 0 0 2.39-.99M2 12s3 7 10 7a9.94 9.94 0 0 0 5.24-1.9M2 2l20 20");
        const Phone = createIcon("M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z");
        const IdCard = createIcon("M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z");
        const Bed = createIcon("M2 4v16h20V4H2zm18 14h-8v-6h8v6zm0-8h-8V6h8v4z");
        const Bath = createIcon("M9 6l-4 4h14l-4-4");
        const Building = createIcon("M16 18v-2a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v2H4V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v13h-2zM10 10h4");
        const Heart = createIcon("M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z");
        const Mail = createIcon("M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6");

        // ListingCard Component
        const ListingCard = ({ listing, onViewListing, onToggleShortlist, isShortlisted }) => (
            <div className="bg-white rounded-xl shadow-lg overflow-hidden transform hover:scale-105 transition-transform duration-300 ease-in-out flex flex-col group">
                <div className="relative">
                    <img className="w-full h-52 object-cover" src={listing.images[0]} alt={listing.title} onError={(e) => { e.target.onerror = null; e.target.src='https://placehold.co/600x400/CCCCCC/FFFFFF?text=Image+Error'; }} />
                    <button 
                        onClick={(e) => { e.stopPropagation(); onToggleShortlist(listing._id); }} 
                        className="absolute top-3 right-3 bg-white/80 backdrop-blur-sm p-2 rounded-full text-gray-700 hover:text-red-500 transition-colors"
                    >
                        <Heart size={20} className={isShortlisted ? 'text-red-500 fill-current' : ''} />
                    </button>
                    <div className="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/70 to-transparent">
                        <h3 className="font-bold text-lg text-white truncate">{listing.title}</h3>
                        <p className="text-gray-300 text-sm flex items-center"><MapPin size={14} className="mr-1.5" /> {listing.address}</p>
                    </div>
                </div>
                <div className="p-4 flex flex-col flex-grow">
                    <div className="flex justify-between items-center mb-3">
                        <p className="text-indigo-600 font-bold text-xl">₹{listing.price.toLocaleString()}<span className="text-sm font-normal text-gray-500">/month</span></p>
                        <p className="text-sm text-gray-600 bg-indigo-100 px-2 py-1 rounded-md font-semibold">{listing.type}</p>
                    </div>
                    <div className="flex items-center text-gray-600 text-sm space-x-4 mb-4">
                        <span className="flex items-center"><Bed size={16} className="mr-1.5" /> {listing.bedrooms} Beds</span>
                        <span className="flex items-center"><Bath size={16} className="mr-1.5" /> {listing.bathrooms} Baths</span>
                        <span className="flex items-center"><Building size={16} className="mr-1.5" /> {listing.sqft} sqft</span>
                    </div>
                    <button onClick={() => onViewListing(listing)} className="mt-auto bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-full text-sm font-semibold transition-colors duration-200 w-full">View Details</button>
                </div>
            </div>
        );

        // FilterSidebar Component for Rentals
        const FilterSidebar = ({ isOpen, onClose, onApplyFilters, availableTypes, initialFilters }) => {
            const [selectedFilters, setSelectedFilters] = useState(initialFilters);

            useEffect(() => { if (isOpen) { setSelectedFilters(initialFilters); } }, [initialFilters, isOpen]);

            const handleCheckboxChange = (filterType, value) => {
                const currentValues = selectedFilters[filterType];
                const newValues = currentValues.includes(value) ? currentValues.filter(v => v !== value) : [...currentValues, value];
                setSelectedFilters(prev => ({ ...prev, [filterType]: newValues }));
            };
            
            const handleReset = () => {
                const resetFilters = { priceRange: [0, 100000], bedrooms: [], types: [] };
                setSelectedFilters(resetFilters);
                onApplyFilters(resetFilters);
                onClose();
            };
            
            const handleApply = () => {
                onApplyFilters(selectedFilters);
                onClose();
            };

            return (
                <>
                    {isOpen && <div className="filter-sidebar-overlay" onClick={onClose}></div>}
                    <div className={`filter-sidebar ${isOpen ? 'open' : ''}`}>
                        <div className="flex flex-col h-full">
                            <div className="p-6 flex justify-between items-center border-b flex-shrink-0">
                                <h2 className="text-2xl font-bold text-gray-800 flex items-center"><X size={24} className="mr-3 cursor-pointer" onClick={onClose}/>FILTERS</h2>
                                <button onClick={handleReset} className="font-semibold text-indigo-600 hover:text-indigo-800">RESET</button>
                            </div>
                            <div className="flex-grow p-6 overflow-y-auto">
                                <div className="space-y-6">
                                    <div>
                                        <h3 className="font-semibold text-gray-700 mb-3 text-sm uppercase tracking-wider">Price Range (per month)</h3>
                                        <div className="flex items-center justify-between text-sm">
                                            <span>₹{Number(selectedFilters.priceRange[0]).toLocaleString()}</span>
                                            <span>₹{Number(selectedFilters.priceRange[1]).toLocaleString()}+</span>
                                        </div>
                                        <input type="range" min="0" max="100000" step="1000" value={selectedFilters.priceRange[1]} onChange={e => setSelectedFilters({...selectedFilters, priceRange: [0, e.target.value]})} className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" />
                                    </div>
                                    <hr/>
                                    <div>
                                        <h3 className="font-semibold text-gray-700 mb-3 text-sm uppercase tracking-wider">Bedrooms</h3>
                                        <div className="grid grid-cols-3 gap-2">
                                            {[1, 2, 3, 4, 5, '6+'].map(num => (
                                                <label key={num} className={`flex items-center justify-center cursor-pointer p-2 border rounded-md text-sm ${selectedFilters.bedrooms.includes(num) ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white'}`}>
                                                    <input type="checkbox" className="hidden" checked={selectedFilters.bedrooms.includes(num)} onChange={() => handleCheckboxChange('bedrooms', num)} />
                                                    {num}
                                                </label>
                                            ))}
                                        </div>
                                    </div>
                                    <hr/>
                                    <div>
                                        <h3 className="font-semibold text-gray-700 mb-3 text-sm uppercase tracking-wider">Property Type</h3>
                                        <div className="space-y-2">
                                            {availableTypes.map(type => (
                                                <label key={type} className="flex items-center justify-between cursor-pointer">
                                                    <span className="text-gray-800 capitalize">{type}</span>
                                                    <input type="checkbox" checked={selectedFilters.types.includes(type)} onChange={() => handleCheckboxChange('types', type)} className="h-5 w-5 rounded text-indigo-600 focus:ring-indigo-500 border-gray-300"/>
                                                </label>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="p-4 bg-white border-t flex-shrink-0">
                                <button onClick={handleApply} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-full transition-colors">
                                    APPLY FILTERS
                                </button>
                            </div>
                        </div>
                    </div>
                </>
            );
        };

        // ListingPage Component
        const ListingPage = ({ listing, onBackToListings, onToggleShortlist, isShortlisted, onOpenContactModal }) => {
            const [mainImage, setMainImage] = useState(listing.images[0]);
            
            return (
                <section className="container mx-auto py-8 md:py-12 px-4">
                    <button onClick={onBackToListings} className="mb-6 flex items-center text-gray-700 hover:text-indigo-500 transition-colors duration-200 font-medium"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mr-2"><path d="M15 18l-6-6 6-6"/></svg>Back to Listings</button>
                    
                    <div className="bg-white p-6 rounded-2xl shadow-xl">
                        {/* Image Gallery */}
                        <div className="mb-6">
                            <img src={mainImage} alt="Main view" className="w-full h-96 object-cover rounded-xl mb-2"/>
                            <div className="flex space-x-2 overflow-x-auto">
                                {listing.images.map((img, idx) => (
                                    <img key={idx} src={img} onClick={() => setMainImage(img)} className={`w-24 h-24 object-cover rounded-lg cursor-pointer border-4 ${mainImage === img ? 'border-indigo-500' : 'border-transparent'}`}/>
                                ))}
                            </div>
                        </div>

                        {/* Main Details */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-2">
                                <p className="text-sm text-indigo-600 font-semibold mb-1">{listing.type}</p>
                                <h2 className="text-4xl font-bold text-gray-800 mb-2">{listing.title}</h2>
                                <p className="text-gray-600 text-lg mb-4 flex items-center"><MapPin size={18} className="mr-2" />{listing.address}</p>
                                
                                <div className="flex items-center space-x-6 border-y py-4 my-4">
                                    <span className="flex items-center text-xl"><Bed size={24} className="mr-2 text-indigo-500" /> {listing.bedrooms} Beds</span>
                                    <span className="flex items-center text-xl"><Bath size={24} className="mr-2 text-indigo-500" /> {listing.bathrooms} Baths</span>
                                    <span className="flex items-center text-xl"><Building size={24} className="mr-2 text-indigo-500" /> {listing.sqft.toLocaleString()} sqft</span>
                                </div>
                                
                                <h3 className="font-bold text-xl text-gray-800 mb-2">Description</h3>
                                <p className="text-gray-700 mb-6">{listing.description}</p>
                                
                                <h3 className="font-bold text-xl text-gray-800 mb-2">Amenities</h3>
                                <div className="flex flex-wrap gap-2">
                                    {listing.amenities.map(amenity => <span key={amenity} className="bg-gray-200 text-gray-800 text-sm font-medium px-3 py-1 rounded-full">{amenity}</span>)}
                                </div>
                            </div>
                            
                            {/* Action Card */}
                            <div className="lg:col-span-1">
                                <div className="border p-6 rounded-xl shadow-md sticky top-24">
                                    <p className="text-3xl font-bold text-indigo-600">₹{listing.price.toLocaleString()}<span className="text-base font-normal text-gray-500">/month</span></p>
                                    <p className="text-gray-600 mb-6">All bills included</p>
                                    <button onClick={() => onOpenContactModal()} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition-colors">Contact Agent</button>
                                    <button onClick={() => onToggleShortlist(listing._id)} className={`w-full mt-2 flex items-center justify-center border border-indigo-600 text-indigo-600 font-bold py-3 px-4 rounded-lg transition-colors ${isShortlisted ? 'bg-indigo-100' : 'hover:bg-indigo-50'}`}>
                                        <Heart size={20} className={`mr-2 ${isShortlisted ? 'text-red-500 fill-current' : ''}`} />
                                        {isShortlisted ? 'Remove from Shortlist' : 'Add to Shortlist'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };
        
        // ContactAgentModal Component
        const ContactAgentModal = ({ agent, onClose }) => {
            if(!agent) return null;
            return (
                <div className="modal-overlay">
                    <div className="modal-content w-full max-w-md">
                        <button onClick={onClose} className="modal-close-button"><X size={24} /></button>
                        <h2 className="text-2xl font-bold text-gray-800 mb-6 text-center">Contact Agent</h2>
                        <div className="space-y-4">
                            <div className="flex items-center space-x-4">
                                <UserIcon size={24} className="text-indigo-500"/>
                                <div>
                                    <p className="text-sm text-gray-500">Name</p>
                                    <p className="text-lg font-semibold text-gray-800">{agent.name}</p>
                                </div>
                            </div>
                            <hr/>
                             <div className="flex items-center space-x-4">
                                <Phone size={24} className="text-indigo-500"/>
                                <div>
                                    <p className="text-sm text-gray-500">Phone</p>
                                    <p className="text-lg font-semibold text-gray-800">{agent.phone}</p>
                                </div>
                            </div>
                             <hr/>
                             <div className="flex items-center space-x-4">
                                <Mail size={24} className="text-indigo-500"/>
                                <div>
                                    <p className="text-sm text-gray-500">Email</p>
                                    <p className="text-lg font-semibold text-gray-800">{agent.email}</p>
                                </div>
                            </div>
                        </div>
                        <div className="mt-8 flex space-x-4">
                            <a href={`tel:${agent.phone}`} className="w-full text-center bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center">
                                <Phone size={20} className="mr-2"/> Call Now
                            </a>
                            <a href={`mailto:${agent.email}`} className="w-full text-center bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center">
                                <Mail size={20} className="mr-2"/> Send Email
                            </a>
                        </div>
                    </div>
                </div>
            );
        };

        // ShortlistView (CartView equivalent)
        const ShortlistView = ({ shortlistedItems, onClose, onRemoveItem, onViewListing }) => (
            <div className="modal-overlay">
                <div className="modal-content w-full md:w-3/4 lg:w-1/2">
                    <button onClick={onClose} className="modal-close-button"><X size={24} /></button>
                    <h2 className="text-3xl font-bold text-gray-800 mb-6 text-center">Your Shortlist</h2>
                    {shortlistedItems.length === 0 ? <p className="text-gray-600 text-center text-lg">Your shortlist is empty.</p> : (
                        <div className="space-y-4">
                            {shortlistedItems.map((item) => (
                                <div key={item._id} className="flex items-center justify-between border-b border-gray-200 py-4 last:border-b-0">
                                    <div className="flex items-center space-x-4 cursor-pointer" onClick={() => onViewListing(item)}>
                                        <img src={item.images[0]} className="w-24 h-24 object-cover rounded-lg" />
                                        <div>
                                            <h4 className="font-semibold text-lg text-gray-800 hover:text-indigo-600">{item.title}</h4>
                                            <p className="text-gray-600">₹{item.price.toLocaleString()}/month</p>
                                        </div>
                                    </div>
                                    <button onClick={() => onRemoveItem(item._id)} className="ml-4 text-red-500 hover:text-red-700 transition-colors duration-200 font-semibold">Remove</button>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            </div>
        );
        
        // AuthModal Component - CORRECTED
        const AuthModal = ({ onClose, onLoginSuccess }) => {
            const [isLoginMode, setIsLoginMode] = useState(true);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [phoneNumber, setPhoneNumber] = useState('');
            const [message, setMessage] = useState('');
            const [loading, setLoading] = useState(false);
            const [showPassword, setShowPassword] = useState(false);
            const [showConfirmPassword, setShowConfirmPassword] = useState(false);

            const getUsers = () => JSON.parse(localStorage.getItem('houseHuntUsers')) || [];
            const saveUsers = (users) => localStorage.setItem('houseHuntUsers', JSON.stringify(users));
            
            const clearForm = () => {
                setUsername(''); setPassword(''); setConfirmPassword(''); setPhoneNumber(''); setMessage('');
            };

            const handleAuth = async (e) => {
                e.preventDefault();
                setMessage(''); setLoading(true);
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                const users = getUsers();
                if (isLoginMode) {
                    if (!username || !password) {
                        setMessage('Username and password are required.'); setLoading(false); return;
                    }
                    const userFound = users.find(user => user.username === username && user.password === password);
                    if (userFound) {
                        onLoginSuccess(username);
                    } else {
                        setMessage('Invalid username or password.');
                    }
                } else {
                    if (!username || !password || !phoneNumber || !confirmPassword) {
                        setMessage('All fields are required for signup.'); setLoading(false); return;
                    }
                    if (password !== confirmPassword) {
                        setMessage('Passwords do not match.'); setLoading(false); return;
                    }
                    if (!/^\d{10}$/.test(phoneNumber)) {
                        setMessage('Please enter a valid 10-digit phone number.'); setLoading(false); return;
                    }
                    if (users.some(user => user.username === username)) {
                        setMessage('Username already exists. Please choose another.');
                    } else {
                        const newUser = { username, password, phoneNumber, userId: 'DHK-' + Math.random().toString(36).substring(2, 9).toUpperCase(), createdAt: new Date().toISOString() };
                        saveUsers([...users, newUser]);
                        setMessage('Signup successful! You can now log in.');
                        onLoginSuccess(username);
                    }
                }
                setLoading(false);
            };

            return (
                <div className="modal-overlay">
                    <div className="modal-content w-full md:w-1/2 lg:w-1/3">
                        <div className="flex justify-center mb-6 border-b border-gray-200">
                            <button onClick={() => { setIsLoginMode(true); clearForm(); }} className={`px-6 py-3 text-lg font-semibold rounded-t-lg transition-colors duration-200 ${isLoginMode ? 'bg-indigo-600 text-white shadow-md' : 'bg-transparent text-gray-700 hover:text-indigo-600'}`}>Login</button>
                            <button onClick={() => { setIsLoginMode(false); clearForm(); }} className={`px-6 py-3 text-lg font-semibold rounded-t-lg transition-colors duration-200 ${!isLoginMode ? 'bg-indigo-600 text-white shadow-md' : 'bg-transparent text-gray-700 hover:text-indigo-600'}`}>Sign Up</button>
                        </div>
                        <h2 className="text-3xl font-bold text-gray-800 mb-6 text-center">{isLoginMode ? 'Welcome Back!' : 'Join House Hunt!'}</h2>
                        <form onSubmit={handleAuth} className="space-y-4">
                            <div><label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="username">Username</label><input type="text" id="username" className="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Your username" value={username} onChange={(e) => setUsername(e.target.value)} required /></div>
                            {!isLoginMode && (<div><label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="phoneNumber">Phone Number</label><input type="tel" id="phoneNumber" className="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="10-digit mobile number" value={phoneNumber} onChange={(e) => setPhoneNumber(e.target.value)} required /></div>)}
                            
                            <div className="relative">
                                <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="password">Password</label>
                                <input type={showPassword ? 'text' : 'password'} id="password" className="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 mb-1 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="***********" value={password} onChange={(e) => setPassword(e.target.value)} required />
                                <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute inset-y-0 right-0 top-6 pr-3 flex items-center text-sm leading-5">
                                    {showPassword ? <EyeOff size={20} className="text-gray-500"/> : <Eye size={20} className="text-gray-500"/>}
                                </button>
                            </div>

                            {!isLoginMode && (
                                <div className="relative">
                                    <label className="block text-gray-700 text-sm font-bold mb-2" htmlFor="confirmPassword">Confirm Password</label>
                                    <input type={showConfirmPassword ? 'text' : 'password'} id="confirmPassword" className="shadow appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 mb-1 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="***********" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} required />
                                    <button type="button" onClick={() => setShowConfirmPassword(!showConfirmPassword)} className="absolute inset-y-0 right-0 top-6 pr-3 flex items-center text-sm leading-5">
                                        {showConfirmPassword ? <EyeOff size={20} className="text-gray-500"/> : <Eye size={20} className="text-gray-500"/>}
                                    </button>
                                </div>
                            )}

                            {message && <p className={`text-center ${message.includes('successful') ? 'text-green-600' : 'text-red-500'} text-sm font-medium`}>{message}</p>}
                            <button type="submit" className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-full w-full focus:outline-none focus:shadow-outline transition-colors duration-200 flex items-center justify-center mt-4" disabled={loading}>{loading && <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>}{loading ? 'Processing...' : (isLoginMode ? 'Login' : 'Sign Up')}</button>
                        </form>
                    </div>
                </div>
            );
        };
        
        // ProfilePage Component
        const ProfilePage = ({ userDetails, shortListedItems, onViewListing, onRemoveFromShortlist }) => {
            if (!userDetails) {
                return ( <div className="flex justify-center items-center h-screen"> <p className="text-xl text-gray-500">Loading profile...</p> </div> );
            }

            const { username, phoneNumber, userId, createdAt } = userDetails;
            const createdDate = createdAt ? new Date(createdAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : 'N/A';
            const createdTime = createdAt ? new Date(createdAt).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }) : '';

            return (
                <section className="container mx-auto py-12 md:py-16 px-4">
                    <h2 className="text-3xl md:text-4xl font-bold text-gray-800 text-center mb-10">Your Profile & Shortlist</h2>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div className="lg:col-span-1">
                             <div className="max-w-md mx-auto bg-white rounded-xl shadow-lg p-8 space-y-6">
                                <div className="flex items-center space-x-4"><UserIcon size={24} className="text-indigo-500"/><div><p className="text-sm text-gray-500">Username</p><p className="text-lg font-semibold text-gray-800">{username}</p></div></div><hr/>
                                <div className="flex items-center space-x-4"><IdCard size={24} className="text-indigo-500"/><div><p className="text-sm text-gray-500">User ID</p><p className="text-lg font-semibold text-gray-800">{userId || 'N/A'}</p></div></div><hr/>
                                <div className="flex items-center space-x-4"><Phone size={24} className="text-indigo-500"/><div><p className="text-sm text-gray-500">Phone Number</p><p className="text-lg font-semibold text-gray-800">{phoneNumber}</p></div></div><hr/>
                                <div className="flex items-center space-x-4"><Calendar size={24} className="text-indigo-500"/><div><p className="text-sm text-gray-500">Member Since</p><p className="text-lg font-semibold text-gray-800">{createdDate} {createdTime}</p></div></div>
                            </div>
                        </div>
                        <div className="lg:col-span-2">
                             <h3 className="text-2xl font-bold text-gray-800 mb-4">Your Shortlisted Properties</h3>
                             {shortListedItems.length === 0 ? <p className="text-gray-600 text-center bg-white p-8 rounded-lg shadow-md">You have not shortlisted any properties yet.</p> :
                                <div className="space-y-4">
                                {shortListedItems.map((item) => (
                                    <div key={item._id} className="flex items-center justify-between p-4 bg-white rounded-lg shadow-md">
                                        <div className="flex items-center space-x-4 cursor-pointer flex-grow" onClick={() => onViewListing(item)}>
                                            <img src={item.images[0]} className="w-20 h-20 object-cover rounded-md" />
                                            <div>
                                                <h4 className="font-semibold text-md text-gray-800 hover:text-indigo-600">{item.title}</h4>
                                                <p className="text-gray-500 text-sm">{item.address}</p>
                                                <p className="text-indigo-600 font-bold text-sm">₹{item.price.toLocaleString()}/month</p>
                                            </div>
                                        </div>
                                        <button onClick={() => onRemoveFromShortlist(item._id)} className="ml-4 text-red-500 hover:text-red-700 transition-colors duration-200 font-semibold">Remove</button>
                                    </div>
                                ))}
                                </div>
                             }
                        </div>
                    </div>
                </section>
            );
        };
        
        // SplashScreen Component
        const SplashScreen = ({ isVisible }) => (
            <div className={`splash-screen ${!isVisible ? 'hidden' : ''}`}>
                <span className="splash-screen-logo">🏠</span>
                <h1 className="text-5xl font-extrabold tracking-wide">DHK House Hunt</h1>
                <p className="text-lg mt-4 animate-pulse">Finding Your Perfect Rental Home</p>
            </div>
        );

        // Main App component
        function App() {
            const [appVisible, setAppVisible] = useState(false);
            const [showSplashScreen, setShowSplashScreen] = useState(true);
            const [isAuthReady, setIsAuthReady] = useState(false);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [shortlist, setShortlist] = useState([]);
            const [currentPage, setCurrentPage] = useState('home');
            const [isShortlistOpen, setIsShortlistOpen] = useState(false);
            const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
            const [selectedListing, setSelectedListing] = useState(null);
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);
            const [currentUserDetails, setCurrentUserDetails] = useState(null);
            const [isFilterModalOpen, setIsFilterModalOpen] = useState(false);
            const [isContactModalOpen, setIsContactModalOpen] = useState(false);
            const [currentAgentDetails, setCurrentAgentDetails] = useState(null);
            const [activeFilters, setActiveFilters] = useState({
                priceRange: [0, 100000], bedrooms: [], types: []
            });

            // Mock Data
            const mockAgents = [
                { name: 'Ravi Kumar', phone: '9876543210', email: 'ravi.kumar@dhkestates.com' },
                { name: 'Priya Sharma', phone: '9876543211', email: 'priya.sharma@dhkestates.com' },
                { name: 'Anil Reddy', phone: '9876543212', email: 'anil.reddy@dhkestates.com' },
                { name: 'Sunita Rao', phone: '9876543213', email: 'sunita.rao@dhkestates.com' },
                { name: 'Vikram Singh', phone: '9876543214', email: 'vikram.singh@dhkestates.com' }
            ];

            const mockListings = [
                { _id: 'prop_001', title: 'Modern 2BHK Apartment', address: 'Jubilee Hills, Hyderabad', price: 35000, bedrooms: 2, bathrooms: 2, sqft: 1200, type: 'Apartment', amenities: ['Lift', 'Security', 'Parking'], images: ['https://images.pexels.com/photos/106399/pexels-photo-106399.jpeg', 'https://images.pexels.com/photos/276724/pexels-photo-276724.jpeg'], description: 'A beautiful and modern apartment in a prime location, perfect for small families.'},
                { _id: 'prop_002', title: 'Spacious 3BHK Villa', address: 'Gachibowli, Hyderabad', price: 65000, bedrooms: 3, bathrooms: 3, sqft: 2200, type: 'Villa', amenities: ['Swimming Pool', 'Gym', 'Garden', 'Security'], images: ['https://images.pexels.com/photos/314937/pexels-photo-314937.jpeg', 'https://images.pexels.com/photos/164558/pexels-photo-164558.jpeg'], description: 'A spacious villa with a private garden and premium amenities.' },
                { _id: 'prop_003', title: 'Cozy Studio Room', address: 'Benz Circle, Vijayawada', price: 15000, bedrooms: 1, bathrooms: 1, sqft: 450, type: 'Studio', amenities: ['A/C', 'WiFi', 'Power Backup'], images: ['https://images.pexels.com/photos/2089698/pexels-photo-2089698.jpeg', 'https://images.pexels.com/photos/2102587/pexels-photo-2102587.jpeg'], description: 'A compact and cozy studio perfect for a single person or a student.' },
                { _id: 'prop_004', title: 'Independent House with Parking', address: 'MVP Colony, Visakhapatnam', price: 28000, bedrooms: 2, bathrooms: 2, sqft: 1500, type: 'Independent House', amenities: ['Parking', 'Terrace', 'Garden'], images: ['https://images.pexels.com/photos/1396122/pexels-photo-1396122.jpeg', 'https://images.pexels.com/photos/259588/pexels-photo-259588.jpeg'], description: 'An independent house with ample space and a private terrace.' },
                { _id: 'prop_005', title: 'Luxury Penthouse', address: 'Banjara Hills, Hyderabad', price: 95000, bedrooms: 4, bathrooms: 4, sqft: 3500, type: 'Penthouse', amenities: ['Swimming Pool', 'Gym', 'Rooftop Deck', 'Security'], images: ['https://images.pexels.com/photos/1438832/pexels-photo-1438832.jpeg', 'https://images.pexels.com/photos/186077/pexels-photo-186077.jpeg'], description: 'Experience luxury living with stunning city views.' },
            ];
            
            const availableTypes = [...new Set(mockListings.map(l => l.type))];

            const filteredListings = mockListings.filter(listing => {
                const { priceRange, bedrooms, types } = activeFilters;
                if (listing.price < priceRange[0] || listing.price > priceRange[1]) return false;
                if (bedrooms.length > 0 && !bedrooms.includes(listing.bedrooms) && !(bedrooms.includes('6+') && listing.bedrooms >= 6)) return false;
                if (types.length > 0 && !types.includes(listing.type)) return false;
                return true;
            });
            
            useEffect(() => {
                const storedUsername = localStorage.getItem('houseHuntLoggedInUser');
                if (storedUsername) {
                    const users = JSON.parse(localStorage.getItem('houseHuntUsers')) || [];
                    const userDetails = users.find(user => user.username === storedUsername);
                    if (userDetails) {
                        setIsLoggedIn(true);
                        setCurrentUser(userDetails.username);
                        setCurrentUserDetails(userDetails);
                    }
                }
                setIsAuthReady(true);
            }, []);

            useEffect(() => {
                if (isAuthReady) {
                    const timer = setTimeout(() => {
                        setShowSplashScreen(false);
                        if (!isLoggedIn) setIsAuthModalOpen(true);
                        setAppVisible(true);
                    }, 1500);
                    return () => clearTimeout(timer);
                }
            }, [isAuthReady, isLoggedIn]);

            useEffect(() => {
                if(currentUser) {
                    const savedShortlist = localStorage.getItem(`shortlist_${currentUser}`);
                    setShortlist(savedShortlist ? JSON.parse(savedShortlist) : []);
                } else { setShortlist([]); }
            }, [currentUser]);

            useEffect(() => {
                if(currentUser) localStorage.setItem(`shortlist_${currentUser}`, JSON.stringify(shortlist));
            }, [shortlist, currentUser]);
            
            const handleToggleShortlist = (listingId) => {
                setShortlist(prev => prev.includes(listingId) ? prev.filter(id => id !== listingId) : [...prev, listingId]);
            };

            const handleLoginSuccess = (username) => {
                const users = JSON.parse(localStorage.getItem('houseHuntUsers')) || [];
                const userDetails = users.find(user => user.username === username);
                localStorage.setItem('houseHuntLoggedInUser', username);
                setIsLoggedIn(true);
                setCurrentUser(username);
                setCurrentUserDetails(userDetails);
                setIsAuthModalOpen(false);
                setAppVisible(true);
                setCurrentPage('home');
            };

            const handleLogout = () => {
                localStorage.removeItem('houseHuntLoggedInUser');
                setIsLoggedIn(false); setCurrentUser(null); setCurrentUserDetails(null);
                setShortlist([]); setAppVisible(false); setCurrentPage('home'); setIsAuthModalOpen(true);
            };
            
            const handleViewListing = (listing) => {
                setSelectedListing(listing);
                setCurrentPage('listingDetail');
            };

            const handleOpenContactModal = () => {
                const randomAgent = mockAgents[Math.floor(Math.random() * mockAgents.length)];
                setCurrentAgentDetails(randomAgent);
                setIsContactModalOpen(true);
            }

            const renderContent = () => {
                if (currentPage === 'listingDetail' && selectedListing) {
                    return <ListingPage 
                        listing={selectedListing} 
                        onBackToListings={() => { setSelectedListing(null); setCurrentPage('listings'); }} 
                        onToggleShortlist={handleToggleShortlist}
                        isShortlisted={shortlist.includes(selectedListing._id)}
                        onOpenContactModal={handleOpenContactModal}
                    />;
                }
                switch (currentPage) {
                    case 'home': return <>
                        <section className="relative bg-gradient-to-r from-indigo-500 to-purple-600 text-white py-20 md:py-32 text-center overflow-hidden rounded-b-xl shadow-lg">
                            <div className="absolute inset-0 opacity-10 bg-cover bg-center animate-pulse-bg" style={{backgroundImage: "url('https://www.transparenttextures.com/patterns/real-carbon-fibre.png')"}}></div>
                            <div className="container mx-auto relative z-10 px-4">
                                <h2 className="text-4xl md:text-6xl font-bold mb-4 leading-tight drop-shadow-lg">Find Your Perfect Rental Home</h2>
                                <p className="text-lg md:text-xl mb-8 max-w-2xl mx-auto opacity-95">Discover a wide range of properties and find the one that fits your lifestyle.</p>
                                <button onClick={() => setCurrentPage('listings')} className="bg-white text-indigo-600 hover:bg-gray-100 px-8 py-3 rounded-full text-lg font-semibold shadow-xl transform transition-all duration-300 ease-in-out hover:scale-105">Browse All Properties</button>
                            </div>
                        </section>
                        <section className="container mx-auto py-12 md:py-16 px-4">
                            <h2 className="text-3xl md:text-4xl font-bold text-gray-800 text-center mb-10">Featured Listings</h2>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">{mockListings.slice(0, 3).map(l => <ListingCard key={l._id} listing={l} onViewListing={handleViewListing} onToggleShortlist={handleToggleShortlist} isShortlisted={shortlist.includes(l._id)} />)}</div>
                            <div className="text-center mt-10"><button onClick={() => setCurrentPage('listings')} className="bg-gray-200 text-gray-800 hover:bg-gray-300 px-8 py-3 rounded-full text-lg font-semibold shadow-md transition-colors">View All Properties</button></div>
                        </section>
                    </>;
                    case 'listings': return <section className="container mx-auto py-12 md:py-16 px-4">
                        <div className="flex justify-between items-center mb-10">
                             <h2 className="text-3xl md:text-4xl font-bold text-gray-800">All Properties</h2>
                             <button onClick={() => setIsFilterModalOpen(true)} className="flex items-center bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-50 shadow-sm transition-colors">
                                <FilterIcon size={20} className="mr-2"/> Filter
                             </button>
                        </div>
                        {filteredListings.length > 0 ? 
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">{filteredListings.map(l => <ListingCard key={l._id} listing={l} onViewListing={handleViewListing} onToggleShortlist={handleToggleShortlist} isShortlisted={shortlist.includes(l._id)} />)}</div> :
                            <p className="text-center text-gray-600 text-lg p-8 bg-white rounded-lg">No properties match your filters.</p>
                        }
                    </section>;
                    case 'contact': return <section className="container mx-auto py-12 md:py-16 px-4 text-center"><h2 className="text-3xl md:text-4xl font-bold text-gray-800 mb-6">Contact Us</h2><p className="text-lg text-gray-700 max-w-xl mx-auto">Have questions or feedback? We'd love to hear from you!</p><div className="mt-8 space-y-4"><p className="text-xl font-semibold text-gray-800">Email: <a href="mailto:hemanthheman86@gmail.com" className="text-indigo-500 hover:underline">hemanthheman86@gmail.com</a></p><p className="text-xl font-semibold text-gray-800">Phone: <a href="tel:+917702807424" className="text-indigo-500 hover:underline">+91 7702807424</a></p><p className="text-lg text-gray-600">Our support team is available Monday to Friday, 9 AM - 6 PM.</p></div></section>;
                    case 'profile': return <ProfilePage 
                        userDetails={currentUserDetails} 
                        shortListedItems={mockListings.filter(l => shortlist.includes(l._id))}
                        onViewListing={handleViewListing}
                        onRemoveFromShortlist={handleToggleShortlist}
                        />;
                    default: return null;
                }
            };

            return (
                <div className="min-h-screen bg-gray-100 font-sans">
                    <SplashScreen isVisible={showSplashScreen} />
                    
                    {appVisible && (
                        <>
                            <header className="bg-white shadow-sm p-4 md:p-6 sticky top-0 z-50">
                                <nav className="container mx-auto flex justify-between items-center">
                                    <div className="flex items-center space-x-2 cursor-pointer" onClick={() => setCurrentPage('home')}><img src="https://placehold.co/40x40/4f46e5/FFFFFF?text=🏠" alt="DHK House Hunt Logo" className="rounded-full" /><h1 className="text-2xl md:text-3xl font-extrabold text-gray-800 tracking-tight">DHK House Hunt</h1></div>
                                    <div className="hidden md:flex items-center space-x-8">{['home', 'listings', 'profile', 'contact'].map(page => <a key={page} onClick={() => setCurrentPage(page)} className={`cursor-pointer capitalize ${currentPage.startsWith(page) ? 'text-indigo-600' : 'text-gray-600'} hover:text-indigo-600 font-medium`}>{page}</a>)}</div>
                                    <div className="hidden md:flex items-center space-x-4">
                                        <div className="relative cursor-pointer" onClick={() => setIsShortlistOpen(true)}>
                                            <Heart className="text-gray-600 hover:text-indigo-600" size={24} />
                                            <span className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full text-xs w-5 h-5 flex items-center justify-center">{shortlist.length}</span>
                                        </div>
                                        {isLoggedIn ? <div className="flex items-center space-x-2 group relative"><LogOut className="text-gray-600 hover:text-indigo-600 cursor-pointer" size={24} onClick={handleLogout} /><span className="text-gray-700 font-medium hidden group-hover:block absolute top-full left-1/2 -translate-x-1/2 bg-gray-700 text-white text-xs px-2 py-1 rounded-md mt-1 whitespace-nowrap">Logout</span></div> : <UserIcon className="text-gray-600 hover:text-indigo-600 cursor-pointer" size={24} onClick={() => setIsAuthModalOpen(true)} />}
                                    </div>
                                    <div className="md:hidden flex items-center space-x-4"><div className="relative cursor-pointer" onClick={() => setIsShortlistOpen(true)}><Heart className="text-gray-600 hover:text-indigo-600" size={28} /><span className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full text-xs w-5 h-5 flex items-center justify-center">{shortlist.length}</span></div><button onClick={() => setIsMobileMenuOpen(o => !o)} className="text-gray-600 hover:text-indigo-600"><Menu size={28} /></button></div>
                                </nav>
                                {isMobileMenuOpen && <div className="md:hidden mt-4 bg-white border-t py-4"><nav className="flex flex-col items-center space-y-3">
                                    {['home', 'listings', 'profile', 'contact'].map(page => <a key={page} onClick={() => {setCurrentPage(page); setIsMobileMenuOpen(false);}} className={`w-full text-center cursor-pointer capitalize ${currentPage.startsWith(page) ? 'text-indigo-600' : 'text-gray-700'} hover:text-indigo-600 font-medium py-2`}>{page}</a>)}
                                    {isLoggedIn && (<div className="w-full border-t border-gray-200 mt-4 pt-4"><a onClick={() => { handleLogout(); setIsMobileMenuOpen(false); }} className="w-full text-center cursor-pointer text-red-500 hover:text-red-700 font-medium py-2 flex items-center justify-center"><LogOut size={20} className="mr-2"/>Logout</a></div>)}
                                </nav></div>}
                            </header>
                            
                            {renderContent()}

                            <footer className="bg-gray-800 text-white py-8 md:py-10 mt-12">
                                <div className="container mx-auto text-center"><p>&copy; {new Date().getFullYear()} DHK House Hunt. All rights reserved.</p></div>
                            </footer>
                        </>
                    )}
                    
                    {isAuthModalOpen && <AuthModal onClose={() => setIsAuthModalOpen(false)} onLoginSuccess={handleLoginSuccess} />}
                    {appVisible && isShortlistOpen && <ShortlistView 
                        shortlistedItems={mockListings.filter(l => shortlist.includes(l._id))} 
                        onClose={() => setIsShortlistOpen(false)} 
                        onRemoveItem={handleToggleShortlist}
                        onViewListing={(listing) => {
                            handleViewListing(listing);
                            setIsShortlistOpen(false);
                        }}
                        />}
                    {appVisible && <FilterSidebar isOpen={isFilterModalOpen} onClose={() => setIsFilterModalOpen(false)} onApplyFilters={setActiveFilters} availableTypes={availableTypes} initialFilters={activeFilters}/>}
                    {appVisible && isContactModalOpen && <ContactAgentModal agent={currentAgentDetails} onClose={() => setIsContactModalOpen(false)} />}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
